schema_version: "1.1"
name: config-worker-count
context:
  scaffold_script: stage-inputs.sh
expected_outcome: |
  The worker-count parser preserves its public signature and default of 4 for None only. Explicit values must be decimal ASCII digits with a parsed value in 1..=64; invalid input returns ConfigError without exposing the raw input. Tests cover None, valid endpoints, empty, nonnumeric, overflow, zero and 65. Existing tests remain intact, no dependencies or process environment mutation are added, and check outcomes are accurately reported.
