schema_version: "1.1"
name: debug-page-overflow
context:
  scaffold_script: stage-inputs.sh
expected_outcome: |
  The agent identifies out-of-bounds slicing and unchecked offset + limit overflow. page returns an empty slice for offset >= data.len(), and otherwise returns a slice ending at min(data.len(), offset + limit) without overflow. It preserves the public signature, existing tests and unrelated helper; adds regression tests for offsets beyond the end, zero limits and usize::MAX; and reports actual checks.
