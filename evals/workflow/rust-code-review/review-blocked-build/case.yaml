schema_version: "1.1"
name: review-blocked-build
context:
  scaffold_script: stage-inputs.sh
expected_outcome: |
  REVIEW.md reports that the crate cannot compile due to the mismatched return
  type in unfinished and that required verification is incomplete. It still
  performs a static review and flags the caller-controlled index in read_byte
  as blocking despite the comment accepting the panic. It proposes checked
  access or an explicit error contract, does not claim tests passed or merge
  readiness, and leaves the source unchanged.
