name: Changeset check

on:
  pull_request:
    branches: [dev]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changeset:
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify a changeset in this PR
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=AMR "$BASE_SHA"...HEAD -- .changeset/ > "$RUNNER_TEMP/changed-fragments.txt"
          awk '$0 ~ /^\.changeset\/[^/]+\.md$/ && $0 != ".changeset/README.md"' "$RUNNER_TEMP/changed-fragments.txt" > "$RUNNER_TEMP/changeset-files.txt"
          if [ ! -s "$RUNNER_TEMP/changeset-files.txt" ]; then
            echo "::error::Add a changeset to this PR or obtain the skip-changelog label."
            exit 1
          fi
          cat "$RUNNER_TEMP/changeset-files.txt"
